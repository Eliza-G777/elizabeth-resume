[build]
  publish = "public"
  command = "echo 'No build step: static pages plus functions'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Pretty links for achievement pages: /achievements/<id>
[[redirects]]
  from = "/achievements/*"
  to = "/achievement.html"
  status = 200

# Project pages: /projects/<id>
[[redirects]]
  from = "/projects/*"
  to = "/project.html"
  status = 200

# Document pages: /documents/<id>
[[redirects]]
  from = "/documents/*"
  to = "/document.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Anything else that doesn't exist
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
